services:
  # Nginx Reverse Proxy for API (public) - api.ralvarez.app
  api-ralvarez-app:
    build:
      context: ./api.ralvarez.app
    hostname: api-ralvarez-app
    ports:
      - "9000:80" # Nginx HTTP
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M
    networks:
      - monitoring

  # Internal Mailer Worker
  worker-internal-mailer:
    build:
      context: ./worker-internal-mailer
      secrets:
        - GITHUB_TOKEN
    hostname: worker-internal-mailer
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          cpus: "0.1"
          memory: 256M
    environment:
      # General Configuration
      MODE: ${INTERNAL_MAILER_MODE}

      # MailerSend Configuration
      MAILERSEND_DOMAIN: ${INTERNAL_MAILER_MAILERSEND_DOMAIN}
      MAILERSEND_NAME: ${INTERNAL_MAILER_MAILERSEND_NAME}
      MAILERSEND_API_KEY: ${INTERNAL_MAILER_MAILERSEND_API_KEY}
      MAILERSEND_SENDER_NAME: ${INTERNAL_MAILER_MAILERSEND_SENDER_NAME}

      # Resend Configuration
      RESEND_DOMAIN: ${INTERNAL_MAILER_RESEND_DOMAIN}
      RESEND_NAME: ${INTERNAL_MAILER_RESEND_NAME}
      RESEND_API_KEY: ${INTERNAL_MAILER_RESEND_API_KEY}
      RESEND_SENDER_NAME: ${INTERNAL_MAILER_RESEND_SENDER_NAME}

      # Selected Mailer
      MAILER: ${INTERNAL_MAILER_MAILER}

      # RabbitMQ Configuration
      RABBITMQ_URL: amqp://${RABBITMQ_INTERNAL_MAILER_USER}:${RABBITMQ_INTERNAL_MAILER_PASSWORD_ENCODED}@rabbitmq:5672/${RABBITMQ_DEFAULT_VHOST}

      # RabbitMQ mails exchange
      RABBITMQ_MAILS_EXCHANGE_NAME: ${RABBITMQ_MAILS_EXCHANGE_NAME}

      # RabbitMQ queue names
      RABBITMQ_WELCOME_EMAILS_QUEUE: ${RABBITMQ_MAILS_WELCOME_EMAILS_QUEUE}
      RABBITMQ_RESET_PASSWORD_EMAILS_QUEUE: ${RABBITMQ_MAILS_RESET_PASSWORD_EMAILS_QUEUE}
      RABBITMQ_VERIFICATION_EMAILS_QUEUE: ${RABBITMQ_MAILS_VERIFICATION_EMAILS_QUEUE}
      RABBITMQ_2FA_EMAIL_CODE_QUEUE: ${RABBITMQ_MAILS_2FA_EMAIL_CODE_QUEUE}

      # RabbitMQ routing keys
      RABBITMQ_WELCOME_EMAILS_ROUTING_KEY: ${RABBITMQ_WELCOME_EMAILS_ROUTING_KEY}
      RABBITMQ_RESET_PASSWORD_EMAILS_ROUTING_KEY: ${RABBITMQ_RESET_PASSWORD_EMAILS_ROUTING_KEY}
      RABBITMQ_VERIFICATION_EMAILS_ROUTING_KEY: ${RABBITMQ_VERIFICATION_EMAILS_ROUTING_KEY}
      RABBITMQ_2FA_CODE_EMAILS_ROUTING_KEY: ${RABBITMQ_2FA_CODE_EMAILS_ROUTING_KEY}
    networks:
      - app-network
      - monitoring
    depends_on:
      rabbitmq:
        condition: service_healthy

  # Auth Service (public and private, port 8081 not exposed) - auth.ralvarez.dev (gRPC) and auth.ralvarez.app (HTTP)
  connect-auth:
    build:
      context: ./connect-auth
      secrets:
        - GITHUB_TOKEN
    hostname: connect-auth
    ports:
      - "9001:8080"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 1.5G
        reservations:
          cpus: "0.1"
          memory: 256M
    environment:
      # Mode
      MODE: ${AUTH_MODE}

      # Admin credentials
      ADMIN_USERNAME: ${AUTH_ADMIN_USERNAME}
      ADMIN_EMAIL: ${AUTH_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD}

      # Server configuration
      DOMAIN: ${DOMAIN}

      # Web App configuration
      VERIFY_EMAIL_URL: ${AUTH_VERIFY_EMAIL_URL}
      RESET_PASSWORD_URL: ${AUTH_RESET_PASSWORD_URL}

      # Postgres Connection
      POSTGRES_DSN: postgres://${POSTGRES_AUTH_DB_USER}:${POSTGRES_AUTH_DB_PASSWORD_ENCODED}@postgres:5432/${POSTGRES_AUTH_DB_NAME}?sslmode=disable
      POSTGRES_MAX_IDLE_CONNECTIONS: ${AUTH_POSTGRES_MAX_IDLE_CONNECTIONS}
      POSTGRES_MAX_OPEN_CONNECTIONS: ${AUTH_POSTGRES_MAX_OPEN_CONNECTIONS}

      # Redis Connection
      REDIS_ADDRESS: redis:6379
      REDIS_USERNAME: ${REDIS_AUTH_USER}
      REDIS_PASSWORD: ${REDIS_AUTH_PASSWORD}
      REDIS_DB: ${REDIS_TOKENS_DB}

      # JWT configuration
      JWT_ISSUER: ${DOMAIN}
      ACCESS_TOKEN_DURATION: ${ACCESS_TOKEN_DURATION}
      REFRESH_TOKEN_DURATION: ${REFRESH_TOKEN_DURATION}

      # RabbitMQ configuration
      RABBITMQ_URL: amqp://${RABBITMQ_AUTH_USER}:${RABBITMQ_AUTH_PASSWORD_ENCODED}@rabbitmq:5672/${RABBITMQ_DEFAULT_VHOST}
      RABBITMQ_MAILS_EXCHANGE_NAME: ${RABBITMQ_MAILS_EXCHANGE_NAME}
      RABBITMQ_WELCOME_EMAILS_ROUTING_KEY: ${RABBITMQ_WELCOME_EMAILS_ROUTING_KEY}
      RABBITMQ_RESET_PASSWORD_EMAILS_ROUTING_KEY: ${RABBITMQ_RESET_PASSWORD_EMAILS_ROUTING_KEY}
      RABBITMQ_VERIFICATION_EMAILS_ROUTING_KEY: ${RABBITMQ_VERIFICATION_EMAILS_ROUTING_KEY}
      RABBITMQ_2FA_CODE_EMAILS_ROUTING_KEY: ${RABBITMQ_2FA_CODE_EMAILS_ROUTING_KEY}

      # BCrypt configuration
      BCRYPT_COST: ${AUTH_BCRYPT_COST}

      # 2FA Email configuration
      TWO_FA_EMAIL_CODE_DURATION: ${AUTH_TWO_FA_EMAIL_CODE_DURATION}
      TWO_FA_EMAIL_CODE_LENGTH: ${AUTH_TWO_FA_EMAIL_CODE_LENGTH}

      # 2FA TOTP configuration
      TOTP_PERIOD: ${AUTH_TOTP_PERIOD}
      TOTP_DIGITS: ${AUTH_TOTP_DIGITS}
      TOTP_SECRET_LENGTH: ${AUTH_TOTP_SECRET_LENGTH}
      TOTP_RECOVERY_CODES_LENGTH: ${AUTH_TOTP_RECOVERY_CODES_LENGTH}
      TOTP_RECOVERY_CODES_COUNT: ${AUTH_TOTP_RECOVERY_CODES_COUNT}
      TOTP_ISSUER: ${DOMAIN}

      # Token configuration
      EMAIL_VERIFICATION_TOKEN_DURATION: ${AUTH_EMAIL_VERIFICATION_TOKEN_DURATION}
      RESET_PASSWORD_TOKEN_DURATION: ${AUTH_RESET_PASSWORD_TOKEN_DURATION}

      # Authentication configuration
      MINIMUM_PASSWORD_LENGTH: ${AUTH_MINIMUM_PASSWORD_LENGTH}
      MINIMUM_PASSWORD_SPECIAL_COUNT: ${AUTH_MINIMUM_PASSWORD_SPECIAL_COUNT}
      MINIMUM_PASSWORD_NUMBERS_COUNT: ${AUTH_MINIMUM_PASSWORD_NUMBERS_COUNT}
      MINIMUM_PASSWORD_CAPS_COUNT: ${AUTH_MINIMUM_PASSWORD_CAPS_COUNT}
      MAXIMUM_FAILED_ATTEMPTS_COUNT: ${AUTH_MAXIMUM_FAILED_ATTEMPTS_COUNT}
      MAXIMUM_FAILED_ATTEMPTS_PERIOD: ${AUTH_MAXIMUM_FAILED_ATTEMPTS_PERIOD}
    volumes:
      - ./jwt/keys/private_key.pem:/app/config/private_key.pem:ro
      - ./jwt/keys/public_key.pem:/app/config/public_key.pem:ro
    networks:
      - app-network
      - monitoring
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # User Service (public) - user.ralvarez.dev (gRPC) and user.ralvarez.app (HTTP)
  connect-user:
    build:
      context: ./connect-user
      secrets:
        - GITHUB_TOKEN
    hostname: connect-user
    ports:
      - "9002:8080"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          cpus: "0.1"
          memory: 256M
    environment:
      # Mode
      MODE: ${USER_MODE}

      # Server configuration
      AUTH_SERVICE_ADDRESS: grpc://auth:8080
      INTERNAL_AUTH_SERVICE_ADDRESS: grpc://auth:8081

      # Postgres Connection
      POSTGRES_DSN: postgres://${POSTGRES_USER_DB_USER}:${POSTGRES_USER_DB_PASSWORD_ENCODED}@postgres:5432/${POSTGRES_USER_DB_NAME}?sslmode=disable
      POSTGRES_MAX_IDLE_CONNECTIONS: ${USER_POSTGRES_MAX_IDLE_CONNECTIONS}
      POSTGRES_MAX_OPEN_CONNECTIONS: ${USER_POSTGRES_MAX_OPEN_CONNECTIONS}

      # Redis configuration
      REDIS_ADDRESS: redis:6379
      REDIS_USERNAME: ${REDIS_USER_USER}
      REDIS_PASSWORD: ${REDIS_USER_PASSWORD}
      REDIS_DB: ${REDIS_TOKENS_DB}
      
      # Neo4j configuration
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USER_USERNAME}
      NEO4J_PASSWORD: ${NEO4J_USER_PASSWORD}
    volumes:
      - ./jwt/keys/public_key.pem:/app/config/public_key.pem:ro
    networks:
      - app-network
      - monitoring
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      connect-auth:
        condition: service_started

  # Chats Service (public) - chats.ralvarez.dev (gRPC) and chats.ralvarez.app (HTTP)
  connect-chats:
    build:
      context: ./connect-chats
      secrets:
        - GITHUB_TOKEN
    hostname: CHATS
    ports:
      - "9003:8080"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          cpus: "0.1"
          memory: 256M
    environment:
      # Mode
      MODE: ${CHATS_MODE}

      # Server configuration
      AUTH_SERVICE_ADDRESS: grpc://auth:8080
      HTTP_FILES_SERVER_ADDRESS: http://http-files-server:8080

      # Postgres Connection
      POSTGRES_DSN: postgres://${POSTGRES_CHATS_DB_USER}:${POSTGRES_CHATS_DB_PASSWORD_ENCODED}@postgres:5432/${POSTGRES_CHATS_DB_NAME}?sslmode=disable
      POSTGRES_MAX_IDLE_CONNECTIONS: ${CHATS_POSTGRES_MAX_IDLE_CONNECTIONS}
      POSTGRES_MAX_OPEN_CONNECTIONS: ${CHATS_POSTGRES_MAX_OPEN_CONNECTIONS}

      # Redis configuration
      REDIS_ADDRESS: redis:6379
      REDIS_USERNAME: ${REDIS_CHATS_USER}
      REDIS_PASSWORD: ${REDIS_CHATS_PASSWORD}
      REDIS_DB: ${REDIS_TOKENS_DB}
    volumes:
      - ./jwt/keys/public_key.pem:/app/config/public_key.pem:ro
    networks:
      - app-network
      - monitoring
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      connect-auth:
        condition: service_started
      http-files-server:
        condition: service_started
        
  # Social Service (public) - social.ralvarez.dev (gRPC) and social.ralvarez.app (HTTP)
  connect-social:
    build:
      context: ./connect-social
      secrets:
        - GITHUB_TOKEN
    hostname: connect-social
    ports:
      - "9004:8080"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          cpus: "0.1"
          memory: 256M
    environment:
      # Mode
      MODE: ${SOCIAL_MODE}

      # Server configuration
      AUTH_SERVICE_ADDRESS: grpc://auth:8080
      
      # Redis configuration
      REDIS_ADDRESS: redis:6379
      REDIS_USERNAME: ${REDIS_SOCIAL_USER}
      REDIS_PASSWORD: ${REDIS_SOCIAL_PASSWORD}
      REDIS_DB: ${REDIS_TOKENS_DB}
      
      # Neo4j configuration
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_SOCIAL_USERNAME}
      NEO4J_PASSWORD: ${NEO4J_SOCIAL_PASSWORD}
    volumes:
      - ./jwt/keys/public_key.pem:/app/config/public_key.pem:ro
    networks:
      - app-network
      - monitoring
    depends_on:
      connect-auth:
        condition: service_started
        
  # Realtime Service (public) - realtime.ralvarez.dev (gRPC) and realtime.ralvarez.app (HTTP)
  websockets-realtime-chats:
    build:
      context: ./websockets-realtime-chats
      secrets:
        - GITHUB_TOKEN
    hostname: websockets-realtime-chats
    ports:
      - "9005:8080"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          cpus: "0.1"
          memory: 256M
    environment:
      # Mode
      MODE: ${REALTIME_MODE}

      # Server configuration
      AUTH_SERVICE_ADDRESS: grpc://auth:8080
      HTTP_FILES_SERVER_ADDRESS: http://http-files-server:8080
      CHATS_SERVICE_ADDRESS: grpc://chats:8080
      
      # Redis configuration
      REDIS_ADDRESS: redis:6379
      REDIS_USERNAME: ${REDIS_REALTIME_USER}
      REDIS_PASSWORD: ${REDIS_REALTIME_PASSWORD}
      REDIS_DB: ${REDIS_TOKENS_DB}
    volumes:
      - ./jwt/keys/public_key.pem:/app/config/public_key.pem:ro
    networks:
      - app-network
      - monitoring
    depends_on:
      http-files-server:
        condition: service_started
      connect-chats:
        condition: service_started
      connect-auth:
        condition: service_started
        
  # HTTP Files Server for User Uploads (public) - files.ralvarez.app
  http-files-server:
    build:
      context: ./http-files-server
      secrets:
        - GITHUB_TOKEN
    hostname: http-files-server
    ports:
      - "9006:8080"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          cpus: "0.1"
          memory: 256M
    environment:
      # Mode
      MODE: ${FILES_SERVER_MODE}
      
      # Files directory
      FILES_SERVER_DIRECTORY: /app/data/files

      # Postgres Connection
      POSTGRES_DSN: postgres://${POSTGRES_FILES_SERVER_DB_USER}:${POSTGRES_FILES_SERVER_DB_PASSWORD_ENCODED}@postgres:5432/${POSTGRES_FILES_SERVER_DB_NAME}?sslmode=disable
      POSTGRES_MAX_IDLE_CONNECTIONS: ${FILES_SERVER_POSTGRES_MAX_IDLE_CONNECTIONS}
      POSTGRES_MAX_OPEN_CONNECTIONS: ${FILES_SERVER_POSTGRES_MAX_OPEN_CONNECTIONS}
      
      # Redis configuration
      REDIS_ADDRESS: redis:6379
      REDIS_USERNAME: ${REDIS_FILES_SERVER_USER}
      REDIS_PASSWORD: ${REDIS_FILES_SERVER_PASSWORD}
      REDIS_DB: ${REDIS_TOKENS_DB}
    volumes:
      - files-server-data:/app/data/files
    networks:
      - app-network
      - monitoring
    depends_on:
      connect-auth:
        condition: service_started

  # Postgres Database (private, port 5432 not exposed)
  postgres:
    image: docker.io/library/postgres:latest
    hostname: postgres
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    environment:
      # Superuser
      POSTGRES_USER: ${POSTGRES_SUPERUSER_NAME}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}

      # Databases
      POSTGRES_AUTH_DB_NAME: ${POSTGRES_AUTH_DB_NAME}
      POSTGRES_USER_DB_NAME: ${POSTGRES_USER_DB_NAME}
      POSTGRES_CHATS_DB_NAME: ${POSTGRES_CHATS_DB_NAME}
      POSTGRES_FILES_SERVER_DB_NAME: ${POSTGRES_FILES_SERVER_DB_NAME}

      # Users
      POSTGRES_AUTH_DB_USER: ${POSTGRES_AUTH_DB_USER}
      POSTGRES_USER_DB_USER: ${POSTGRES_USER_DB_USER}
      POSTGRES_CHATS_DB_USER: ${POSTGRES_CHATS_DB_USER}
      POSTGRES_FILES_SERVER_DB_USER: ${POSTGRES_FILES_SERVER_DB_USER}

      # Passwords
      POSTGRES_AUTH_DB_PASSWORD: ${POSTGRES_AUTH_DB_PASSWORD}
      POSTGRES_USER_DB_PASSWORD: ${POSTGRES_USER_DB_PASSWORD}
      POSTGRES_CHATS_DB_PASSWORD: ${POSTGRES_CHATS_DB_PASSWORD}
      POSTGRES_FILES_SERVER_DB_PASSWORD: ${POSTGRES_FILES_SERVER_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/initdb.d:/docker-entrypoint-initdb.d:ro
      - ./postgres/config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    networks:
      - app-network
      - monitoring
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $POSTGRES_SUPERUSER_NAME && psql -U $POSTGRES_AUTH_DB_USER -d $POSTGRES_AUTH_DB_NAME -c '\\q' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s # Allow time for DB and users to be created

  # Redis Cache (private, port 6379 not exposed)
  redis:
    image: docker.io/library/redis:latest
    hostname: redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    environment:
      # Root Password
      REDIS_DEFAULT_PASSWORD: ${REDIS_DEFAULT_PASSWORD}

      # Databases
      REDIS_TOKENS_DB: ${REDIS_TOKENS_DB}

      # Users
      REDIS_AUTH_USER: ${REDIS_AUTH_USER}
      REDIS_USER_USER: ${REDIS_USER_USER}
      REDIS_CHATS_USER: ${REDIS_CHATS_USER}
      REDIS_SOCIAL_USER: ${REDIS_SOCIAL_USER}
      REDIS_REALTIME_USER: ${REDIS_REALTIME_USER}
      REDIS_FILES_SERVER_USER: ${REDIS_FILES_SERVER_USER}

      # Passwords
      REDIS_AUTH_PASSWORD: ${REDIS_AUTH_PASSWORD}
      REDIS_USER_PASSWORD: ${REDIS_USER_PASSWORD}
      REDIS_CHATS_PASSWORD: ${REDIS_CHATS_PASSWORD}
      REDIS_SOCIAL_PASSWORD: ${REDIS_SOCIAL_PASSWORD}
      REDIS_REALTIME_PASSWORD: ${REDIS_REALTIME_PASSWORD}
      REDIS_FILES_SERVER_PASSWORD: ${REDIS_FILES_SERVER_PASSWORD}
    volumes:
      - redis-data:/data
      - ./redis/config/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./redis/entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
      - ./redis/initdb.d:/docker-entrypoint-initdb.d:ro
    command:
      [
        "redis-server",
        "/usr/local/etc/redis/redis.conf",
        "--requirepass",
        "${REDIS_DEFAULT_PASSWORD}",
        "--aclfile",
        "/data/users.acl",
        "--loglevel",
        "warning",
      ]
    entrypoint: ["/bin/sh", "/usr/local/bin/docker-entrypoint.sh"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 60s # Allow time for Redis to initialize
    networks:
      - app-network
      - monitoring

  # RabbitMQ Message Broker (private, ports 6721 and 15672 not exposed)
  rabbitmq:
    image: docker.io/library/rabbitmq:3-management
    hostname: rabbitmq
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    environment:
      # Logs
      RABBITMQ_LOGS: "/var/log/rabbitmq/rabbitmq.log"
      RABBITMQ_LOG_LEVEL: "warning"

      # Default User
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASSWORD}

      # Default VHost
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST}

      # Users
      RABBITMQ_AUTH_USER: ${RABBITMQ_AUTH_USER}
      RABBITMQ_INTERNAL_MAILER_USER: ${RABBITMQ_INTERNAL_MAILER_USER}

      # Passwords
      RABBITMQ_AUTH_PASSWORD: ${RABBITMQ_AUTH_PASSWORD}
      RABBITMQ_INTERNAL_MAILER_PASSWORD: ${RABBITMQ_INTERNAL_MAILER_PASSWORD}

      # Exchanges
      RABBITMQ_MAILS_EXCHANGE_NAME: ${RABBITMQ_MAILS_EXCHANGE_NAME}

      # Mails queues
      RABBITMQ_MAILS_QUEUES: ${RABBITMQ_MAILS_QUEUES}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
      - ./rabbitmq/initdb.d:/docker-entrypoint-initdb.d:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/docker-entrypoint.sh"]
    healthcheck:
      test: rabbitmq-diagnostics -q ping && rabbitmq-diagnostics -q check_port_connectivity
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 120s # Allow time for RabbitMQ to initialize
    networks:
      - app-network
      - monitoring
      
  # Neo4j Graph Database (private, ports 7474 and 7687 not exposed)
  neo4j:
    build: 
      context: ./neo4j
    hostname: neo4j
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 1G
    ports:
      - "7474:7474"  # HTTP API
      - "7687:7687"  # Bolt Protocol
    environment:
      # Memory settings
      NEO4J_server_memory_pagecache_size: 512M
      NEO4J_server_memory_heap_max__size: 1G
      
      # Enable APOC plugin
      NEO4J_PLUGINS: '["apoc"]'
      
      # Default authentication for the main
      NEO4J_AUTH: "${NEO4J_DEFAULT_USERNAME}/${NEO4J_DEFAULT_PASSWORD}"
      
      # Neo4j usernames
      NEO4JDB_DEFAULT_USERNAME: "${NEO4J_DEFAULT_USERNAME}"
      NEO4JDB_USER_USERNAME: "${NEO4J_USER_USERNAME}"
      NEO4JDB_SOCIAL_USERNAME: "${NEO4J_SOCIAL_USERNAME}"
      
      # Neo4j passwords
      NEO4JDB_DEFAULT_PASSWORD: "${NEO4J_DEFAULT_PASSWORD}"
      NEO4JDB_USER_PASSWORD: "${NEO4J_USER_PASSWORD}"
      NEO4JDB_SOCIAL_PASSWORD: "${NEO4J_SOCIAL_PASSWORD}"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD", "/app/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - app-network
      - monitoring

  # Prometheus (private, port 9090 not exposed)
  prometheus:
    image: docker.io/prom/prometheus:latest
    hostname: prometheus
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512M
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus-data:/prometheus
    command:
      [
        "--config.file=/etc/prometheus/prometheus.yml",
        "--storage.tsdb.path=/prometheus",
        "--storage.tsdb.retention.time=30d",
        "--web.console.libraries=/etc/prometheus/console_libraries",
        "--web.console.templates=/etc/prometheus/consoles",
        "--web.enable-lifecycle",
      ]
    networks:
      - monitoring

  # Node Exporter (private, port 9100 not exposed)
  node-exporter:
    image: docker.io/prom/node-exporter:latest
    hostname: node-exporter
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      [
        "--path.procfs=/host/proc",
        "--path.sysfs=/host/sys",
        "--path.rootfs=/rootfs",
        "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)",
      ]
    networks:
      - monitoring

  # cAdvisor (private, port 8080 not exposed)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    hostname: cadvisor
    restart: unless-stopped
    privileged: true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/containers:/var/lib/containers:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - monitoring

  # Loki (private, port 3100 not exposed)
  loki:
    image: docker.io/grafana/loki:latest
    hostname: loki
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 384M
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml
      - loki-data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    networks:
      - monitoring

  # Promtail (private, port 9080 not exposed)
  promtail:
    image: docker.io/grafana/promtail:latest
    hostname: promtail
    restart: unless-stopped
    user: "0:0"  # Run as root to access journal
    privileged: true  # Needed for journal access
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml
      - /var/log:/var/log:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    networks:
      - monitoring
    depends_on:
      - loki

  # Grafana (public) - grafana.ralvarez.app
  grafana:
    image: docker.io/grafana/grafana:latest
    hostname: grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 384M
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GRAFANA_SERVER_ROOT_URL}
      GF_SERVER_DOMAIN: ${GRAFANA_SERVER_DOMAIN}
      GF_USERS_ALLOW_SIGN_UP: ${GRAFANA_USERS_ALLOW_SIGN_UP}
    networks:
      - monitoring
    depends_on:
      - prometheus
      - loki

secrets:
  GITHUB_TOKEN:
    file: ./.github_token

volumes:
  files-server-data: {}
  postgres-data: {}
  redis-data: {}
  rabbitmq-data: {}
  neo4j-data: {}
  neo4j-logs: {}
  grafana-data: {}
  prometheus-data: {}
  loki-data: {}

networks:
  app-network:
    driver: bridge
  monitoring:
    driver: bridge
